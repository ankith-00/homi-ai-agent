[project]
name = "ai-agent"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "composio>=0.30.0",
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "logfire>=5.3.0",
    "mcp>=2.3.0",
    "mem0ai>=2.2.1",
    "motor>=3.7.1",
    "pydantic-ai>=2.60.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2025.2",
]

[project.scripts]
homi-agent = "app.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
